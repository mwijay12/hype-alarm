<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070C1E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Electric Blue Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070C1E" stop-opacity="0"/>
    </radialGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Bell Body Outer Gradient -->
    <linearGradient id="bellOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Bell Ring Bezel -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#BAE6FD"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="boltGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#centerGlow)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- 2. Hype Soundwaves (Left & Right Energy Arcs) -->
  <g opacity="0.85" filter="url(#neonGlow)">
    <!-- Left Arcs -->
    <path d="M 120 180 A 100 100 0 0 0 120 332" stroke="#0EA5E9" stroke-width="6" stroke-linecap="round"/>
    <path d="M 85 150 A 140 140 0 0 0 85 362" stroke="#2563EB" stroke-width="4" stroke-opacity="0.6" stroke-linecap="round"/>
    <!-- Right Arcs -->
    <path d="M 392 180 A 100 100 0 0 1 392 332" stroke="#0EA5E9" stroke-width="6" stroke-linecap="round"/>
    <path d="M 427 150 A 140 140 0 0 1 427 362" stroke="#2563EB" stroke-width="4" stroke-opacity="0.6" stroke-linecap="round"/>
  </g>

  <!-- 3. Alarm Bell Details: Top Bells & Legs -->
  <!-- Left Leg -->
  <rect x="145" y="375" width="40" height="55" rx="8" transform="rotate(22 165 402)" fill="#1E3A8A" stroke="#3B82F6" stroke-width="3"/>
  <!-- Right Leg -->
  <rect x="327" y="375" width="40" height="55" rx="8" transform="rotate(-22 347 402)" fill="#1E3A8A" stroke="#3B82F6" stroke-width="3"/>

  <!-- Left Bell Dome -->
  <g transform="rotate(-25 155 140)">
    <ellipse cx="155" cy="140" rx="42" ry="32" fill="#1E3A8A" stroke="#60A5FA" stroke-width="4"/>
    <ellipse cx="152" cy="132" rx="24" ry="14" fill="#3B82F6" opacity="0.6"/>
  </g>

  <!-- Right Bell Dome -->
  <g transform="rotate(25 357 140)">
    <ellipse cx="357" cy="140" rx="42" ry="32" fill="#1E3A8A" stroke="#60A5FA" stroke-width="4"/>
    <ellipse cx="360" cy="132" rx="24" ry="14" fill="#3B82F6" opacity="0.6"/>
  </g>

  <!-- Top Center Hammer Knob -->
  <rect x="240" y="86" width="32" height="42" rx="6" fill="#2563EB" stroke="#93C5FD" stroke-width="3"/>
  <circle cx="256" cy="88" r="14" fill="#60A5FA" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- 4. Main Alarm Clock Face Body -->
  <circle cx="256" cy="256" r="130" fill="url(#bellOuter)" stroke="url(#ringGrad)" stroke-width="8" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="118" fill="#0B132B" stroke="#1E293B" stroke-width="3"/>

  <!-- Clock Dial Hour Markers -->
  <g opacity="0.75" stroke="#93C5FD" stroke-linecap="round">
    <line x1="256" y1="148" x2="256" y2="160" stroke-width="4"/>
    <line x1="256" y1="364" x2="256" y2="352" stroke-width="4"/>
    <line x1="148" y1="256" x2="160" y2="256" stroke-width="4"/>
    <line x1="364" y1="256" x2="352" y2="256" stroke-width="4"/>
    <!-- Subtle Hour Dots -->
    <circle cx="310" cy="163" r="2.5" fill="#60A5FA"/>
    <circle cx="349" cy="202" r="2.5" fill="#60A5FA"/>
    <circle cx="349" cy="310" r="2.5" fill="#60A5FA"/>
    <circle cx="310" cy="349" r="2.5" fill="#60A5FA"/>
    <circle cx="202" cy="349" r="2.5" fill="#60A5FA"/>
    <circle cx="163" cy="310" r="2.5" fill="#60A5FA"/>
    <circle cx="163" cy="202" r="2.5" fill="#60A5FA"/>
    <circle cx="202" cy="163" r="2.5" fill="#60A5FA"/>
  </g>

  <!-- Specular Lens Glare -->
  <path d="M 160 210 Q 256 160 352 210 A 118 118 0 0 0 160 210 Z" fill="#FFFFFF" opacity="0.06"/>

  <!-- 5. Central High-Energy Lightning Bolt (The Hype Core) -->
  <g filter="url(#boltGlow)">
    <polygon points="268,165 222,252 254,252 236,338 290,240 256,240" fill="url(#boltGrad)" stroke="#38BDF8" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="265,185 232,250 255,250 245,315 278,244 257,244" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Central Star Pulse -->
  <circle cx="256" cy="246" r="3" fill="#FFFFFF" filter="url(#neonGlow)"/>
</svg>
